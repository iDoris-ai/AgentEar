[package]
name = "agentear"
version = "0.2.0"
edition = "2021"
description = "本地语音采集与转写守护进程（快捷键录音 → 本地转写 → 自动上屏）"
license = "Apache-2.0"

[dependencies]
# 音频采集
cpal = "0.15"
hound = "3.5"

# 全局快捷键（Carbon RegisterEventHotKey，不需要辅助功能权限）
global-hotkey = "0.6"

# 剪贴板
arboard = "3.4"

# 内容寻址（提交协议）
sha2 = "0.10"

# 基础设施
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
libc = "0.2.189"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
core-foundation = "0.10.1"
block2 = "0.6.2"
core-graphics = "0.25.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
strip = true
