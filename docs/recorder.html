<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>录音工具 · AgentEar Recorder</title>
<style>
:root{color-scheme:light dark;--paper:#fbfaf7;--ink:#1b1b1a;--slate:#6b6a66;
  --rule:#d9d6cf;--signal:#B8332B;--done:#1F6B5C;--read:1.05rem;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
  --thai:"Noto Sans Thai","Leelawadee UI","Sukhumvit Set",Thonburi,var(--ui)}
@media(prefers-color-scheme:dark){:root{--paper:#16171a;--ink:#e9e7e2;--slate:#9a978f;--rule:#33353a}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 var(--ui)}
/* 泰文有上下叠加的元音和声调符号，行高不给够会糊在一起 */
html[lang=th] body{font-family:var(--thai);line-height:1.85}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.langs{display:flex;gap:.25rem;flex:none}
.langs button{font:inherit;font-size:.85rem;cursor:pointer;border:1px solid var(--rule);
  background:transparent;color:var(--slate);border-radius:6px;padding:.2rem .55rem}
.langs button[aria-pressed=true]{border-color:var(--ink);color:var(--ink);font-weight:600}
.proof{margin-top:.8rem;font-size:.8rem;opacity:.85}
.wrap{max-width:56rem;margin:0 auto;padding:1.6rem 1.1rem 5rem}
h1{font-size:1.35rem;margin:0 0 .2rem}
.sub{color:var(--slate);font-size:.92rem;margin:0 0 1.4rem}
fieldset{border:1px solid var(--rule);border-radius:9px;padding:.9rem 1rem;margin:0 0 1.2rem}
legend{padding:0 .4rem;font-size:.86rem;color:var(--slate)}
label{font-size:.9rem}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:.35rem .55rem}
textarea{width:100%;min-height:8rem;font-size:var(--read);line-height:1.7;resize:vertical}
.row{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}
.hint{font-size:.83rem;color:var(--slate);margin:.3rem 0 0}
.btn{font:inherit;cursor:pointer;border:1px solid var(--rule);background:transparent;
  color:var(--ink);border-radius:7px;padding:.4rem .8rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{border-color:var(--signal);color:var(--signal);font-weight:600}
.take{border:1px solid var(--rule);border-radius:9px;padding:.7rem .9rem;margin-bottom:.7rem}
.take[data-state=recording]{border-color:var(--signal);box-shadow:inset 3px 0 0 var(--signal)}
.take[data-state=done]{box-shadow:inset 3px 0 0 var(--done)}
.take-head{display:flex;gap:.6rem;align-items:baseline;margin-bottom:.4rem}
.no{font-variant-numeric:tabular-nums;color:var(--slate);font-size:.85rem;min-width:2.2rem}
.txt{flex:1;font-size:var(--read);white-space:pre-wrap;word-break:break-word}
.txt.free{color:var(--slate);font-style:italic}
.ctl{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;color:var(--slate);min-width:3.4rem}
.meter{display:inline-block;width:6rem;height:.5rem;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--done)}
.meter.hot i{background:var(--signal)}
audio{height:2rem;max-width:14rem}
.stat{font-size:.85rem;color:var(--slate);margin:.35rem 0 0}
.bad{font-size:.85rem;color:var(--signal);margin:.35rem 0 0}
.bad .btn{margin-top:.4rem}
.pill{display:inline-block;border:1px solid var(--rule);border-radius:999px;
  padding:.1rem .6rem;font-size:.82rem;color:var(--slate)}
.pill.ok{border-color:var(--done);color:var(--done)}
code{font-size:.85em;background:color-mix(in srgb,var(--ink) 7%,transparent);
  padding:.05em .3em;border-radius:3px}
footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule);
  font-size:.85rem;color:var(--slate)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="th">ไทย</button>
    </div>
  </div>

  <fieldset>
    <legend data-i18n="settings"></legend>
    <div class="row">
      <label><span data-i18n="speaker"></span> <input id="speaker" type="text" maxlength="24" placeholder="anon" size="10"></label>
      <span class="hint" id="namehint"></span>
      <label><span data-i18n="rate"></span>
        <select id="rate">
          <option value="0" selected data-i18n="rate0"></option>
          <option value="48000">48 kHz</option>
          <option value="32000">32 kHz</option>
          <option value="24000">24 kHz</option>
          <option value="22050">22.05 kHz</option>
          <option value="16000">16 kHz</option>
        </select>
      </label>
      <label><span data-i18n="maxlen"></span> <input id="maxsec" type="number" min="5" max="300" value="240" size="4"> <span data-i18n="sec"></span></label>
      <span class="hint" id="memhint"></span>
      <span class="pill" id="devpill"></span>
    </div>
    <p class="hint" id="ratehint"></p>
  </fieldset>

  <fieldset>
    <legend data-i18n="script"></legend>
    <textarea id="script"></textarea>
    <div class="row" style="margin-top:.6rem">
      <button class="btn primary" id="apply" type="button" data-i18n="apply"></button>
      <button class="btn" id="addfree" type="button" data-i18n="addfree"></button>
      <span class="hint" id="scripthint"></span>
    </div>
  </fieldset>

  <div class="row">
    <span class="pill" id="prog"></span>
    <button class="btn" id="zip" type="button" disabled data-i18n="zipbtn"></button>
    <span class="hint" data-i18n="ziphint"></span>
  </div>

  <div id="takes"></div>

  <footer>
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
    <p id="diag" class="hint"></p>
    <p class="proof" data-i18n="proof"></p>
  </footer>
</div>

<script src="recorder-core.js"></script>
<script>
"use strict";
/* 核心是外部文件，404 或被拦就整段脚本抛 ReferenceError —— 连专门用来
   「把失败说出来」的 envCheck() 都跑不到，页面白着，人不知道发生了什么。
   拆成两个文件之后多出来的失败模式，先堵上。 */
if (typeof RecorderCore === "undefined") {
  // 这段跑在 i18n 表建立**之前**，只能硬编码 —— 但三语都要有，
  // 否则泰语/英语的使用者撞上它只会看到一段看不懂的中文。
  document.body.innerHTML =
    '<div style="max-width:44rem;margin:4rem auto;padding:0 1rem;font:15px/1.7 system-ui">' +
    '<h1 style="font-size:1.15rem">recorder-core.js not loaded</h1>' +
    '<p>请通过 <code>scripts/recorder.sh</code>（Windows：<code>scripts\\recorder.bat</code>）启动，' +
    '不要直接双击 HTML —— 那样浏览器既拿不到麦克风（不是安全上下文），' +
    '也可能加载不了同目录的脚本。</p>' +
    '<p>Start it with <code>scripts/recorder.sh</code> (Windows: <code>scripts\\recorder.bat</code>) ' +
    'rather than opening the file directly — <code>file://</code> is not a secure context, ' +
    'so the microphone will not work.</p>' +
    '<p>กรุณาเปิดด้วย <code>scripts/recorder.sh</code> แทนการดับเบิลคลิกไฟล์ ' +
    'เพราะ <code>file://</code> ใช้ไมโครโฟนไม่ได้</p></div>';
  throw new Error("recorder-core.js not loaded");
}

const { startCapture, toWav, sha256hex16, diagnose, normText } = RecorderCore;

   每个字符串翻倍；再加一门就是三倍，而且改一处要改三处，必然分叉。
   这里页面只写 key，语言集中在一张表里。

   ⚠️ 泰文由非母语者撰写、**未经母语者校对**（与 src/i18n.rs 同一状态）。

    ziptoobig:"รวมประมาณ {gb} GB เกินขีดจำกัด 4 GB ของ ZIP32 — แบ่งดาวน์โหลด หรือลดอัตราสุ่ม",
    r0:"คงอัตราสุ่มเดิมของอุปกรณ์ (มักเป็น 44.1 หรือ 48 kHz) **เหมาะที่สุดสำหรับโคลนเสียง** — ไม่แปลงอัตราสุ่มเลย",
    r48:"ระดับออกอากาศ เพียงพอสำหรับโคลนเสียงและงานหลังการผลิต ไฟล์ใหญ่ที่สุด",
    r32:"อัตราสุ่มดั้งเดิมของ GPT-SoVITS",
    r24:"อัตราสุ่มดั้งเดิมของ XTTS / F5-TTS / CosyVoice ขนาดราวครึ่งหนึ่งของ 48 kHz",
    r22:"พบบ่อยใน TTS รุ่นเก่า",
    r16:"⚠️ **สำหรับคลังข้อมูล ASR / ตรวจทานผลถอดเสียง** ถ้าเอาไปโคลนเสียง เสียงจะทึบลงชัดเจน — ความถี่เหนือ 8 kHz หายไปหมด ซึ่งเป็นย่านของเสียงลมและเสียงเสียดแทรก",
  },
};
let LANG = "zh";
/* 叫 T 不叫 t —— 这个文件里 `t` 一直是「段落」变量（startTake(t)、
   for (const t of takes)），同名会在那些作用域里把翻译函数遮蔽掉，
   而且是运行时才炸、语法检查看不出来。 */
const T = (k, vars) => {
  let out = (I18N[LANG] && I18N[LANG][k] !== undefined) ? I18N[LANG][k]
          : (I18N.zh[k] !== undefined ? I18N.zh[k] : k);
  if (vars) for (const [a, b] of Object.entries(vars)) out = out.split("{" + a + "}").join(b);
  return out;
};
let lastParaCount = 0;
const bold = x => x.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
/* 质量提示在核心里带 {zh,th,en}，按界面语言取；缺哪门回退英文 */
const qmsg = p => p[LANG] || p.en || p.zh;


/* ── 会话：一次只允许一路录音 ──
   和 thai-recorder.html 同一套纪律（那套竞态修了三次）：
   **单一持有者令牌**，任何回调改共享状态之前先验证 `owns(token)`。
   这里比那个页面简单一档 —— 全局只有「当前正在录哪一段」这一个状态，
   而不是 N 个各自独立、能互相抢的按钮，在飞的异步路径少得多。 */
const S = { stream:null, ctx:null, source:null, analyser:null, rafId:null,
            holder:null, cap:null, finish:null, trackSettings:null, tickId:0, gen:0 };
let tokenSeq = 0;
const owns = t => !!S.holder && S.holder.token === t;

const takes = [];              // { id, no, text, free, blob, quality, sha, seconds, src, saved, override }
let seq = 0;
const $ = s => document.querySelector(s);
const mmss = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── 本机记忆：脚本和署名，别让人重开页面就得重贴。
   localStorage 在无痕窗口/禁用站点数据时会直接抛，所以读写都包 try。 ── */
const LS = "agentear-recorder-v1";
const save = () => { try { localStorage.setItem(LS, JSON.stringify(
  { speaker:$("#speaker").value, script:$("#script").value,
    rate:$("#rate").value, maxsec:$("#maxsec").value, lang:LANG })); } catch (_) {} };
const load = () => { try {
  const d = JSON.parse(localStorage.getItem(LS) || "{}");
  if (d.speaker) $("#speaker").value = d.speaker;
  if (d.script) $("#script").value = d.script;
  if (d.rate) $("#rate").value = d.rate;
  if (d.maxsec) $("#maxsec").value = d.maxsec;
  if (d.lang && I18N[d.lang]) LANG = d.lang;
  else {                       // 没存过就跟浏览器；认不出就回中文
    const p = (navigator.languages || [navigator.language || ""]).map(x => String(x).toLowerCase());
    if (p.some(x => x.startsWith("th"))) LANG = "th";
    else if (p.some(x => x.startsWith("zh"))) LANG = "zh";
    else if (p.length && p[0]) LANG = "en";
  }
} catch (_) {} };

/* 文件名里的署名**只用 ASCII**。
   zip 里设了 UTF-8 标志位（0x0800）没错，但实测 Info-ZIP 的 `unzip`
   在 macOS 上解中文文件名会 `Illegal byte sequence` —— 只解出 manifest.txt，
   WAV 全丢（ditto / Finder 正常）。志愿者在 Linux 或命令行解包就会踩到。
   原样的署名仍然写进 manifest 的 speaker 字段，不丢信息。 */
const speakerId = () => {
  const v = ($("#speaker").value || "").trim().toLowerCase();
  return v.replace(/[^a-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24) || "anon";
};
const speakerLabel = () => ($("#speaker").value || "").trim() || "anon";

/* ── 采样率的取舍写在界面上，不只写在注释里 ──
   泰语那个页面写死 16 kHz 是因为它是 ASR 语料工具；这里不能照抄。 */
const RATE_KEY = { "0":"r0","48000":"r48","32000":"r32","24000":"r24","22050":"r22","16000":"r16" };
const rateHint = () => { $("#ratehint").innerHTML = bold(T(RATE_KEY[$("#rate").value] || "r0")); };

/* ── 环境自检：不支持就当场说，别让人录完才发现存不下来 ── */
function envCheck() {
  const d = diagnose();
  const ok = d.secure && d.gum && d.ac && d.dl;
  $("#diag").textContent = ok
    ? T("envok", { secure:d.secure, dl:d.dl }) + (d.framed ? T("framed") : "")
    : T("envbad", { secure:d.secure, gum:d.gum, ac:d.ac, dl:d.dl });
  $("#diag").style.color = ok ? "" : "var(--signal)";
  return ok;
}

/* ── 麦克风 ── */
function releaseMic(force) {
  if (!force && S.holder) return;
  if (S.rafId) { cancelAnimationFrame(S.rafId); S.rafId = null; }
  if (S.stream) { S.stream.getTracks().forEach(t=>t.stop()); S.stream = null; }
  if (S.source) { try { S.source.disconnect(); } catch(_){} S.source = null; }
  if (S.ctx) { S.ctx.close().catch(()=>{}); S.ctx = null; }
  S.analyser = null;
  document.querySelectorAll(".meter i").forEach(i => i.style.width = "0%");
  $("#devpill").textContent = T("micoff"); $("#devpill").classList.remove("ok");
}

async function acquireMic(token) {
  if (S.stream) return null;
  let got;
  try {
    // 关掉降噪/AGC：要的是原始音频。声音克隆尤其怕 AGC 把动态压平。
    got = await navigator.mediaDevices.getUserMedia({ audio: {
      channelCount:1, echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
  } catch (e) {
    if (!owns(token)) return { superseded:true };
    return { msg: T("micfail", { name:e.name, msg:e.message }) };
  }
  // 申请期间可能已跨代：自己关掉自己拿到的 track，绝不写进 S
  if (!owns(token)) { got.getTracks().forEach(t=>t.stop()); return { superseded:true }; }
  let ctx = null;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    S.stream = got;
    // 请求的约束不代表设备照做了，记下**实际生效**的值
    try { S.trackSettings = got.getAudioTracks()[0].getSettings(); } catch(_) { S.trackSettings = null; }
    ctx = new AC(); S.ctx = ctx;
    S.analyser = ctx.createAnalyser(); S.analyser.fftSize = 1024;
    S.source = ctx.createMediaStreamSource(S.stream);
    S.source.connect(S.analyser);
    if (ctx.state === "suspended") await ctx.resume();
    // resume 是 await 点，期间可能 pagehide 过
    if (!owns(token) || S.ctx !== ctx) return { superseded:true };
  } catch (e) {
    // 只在自己仍是持有者时清全局，否则只关自己申请到的那份
    if (owns(token) && S.ctx === ctx) releaseMic(true);
    else { try { got.getTracks().forEach(t=>t.stop()); } catch(_){} if (ctx) ctx.close().catch(()=>{}); }
    return { msg: T("audiofail", { name:e.name, msg:e.message }) };
  }
  const ts = S.trackSettings || {};
  $("#devpill").textContent = T("micon", { rate: ts.sampleRate || S.ctx.sampleRate, ch: ts.channelCount || 1 });
  $("#devpill").classList.add("ok");
  return null;
}

function levelLoop() {
  if (S.rafId || !S.analyser) return;
  const buf = new Uint8Array(S.analyser.fftSize);
  const tick = () => {
    const h = S.holder;
    if (!S.analyser || !h || h.phase !== "recording") {
      S.rafId = null;
      document.querySelectorAll(".meter i").forEach(i => i.style.width = "0%");
      return;
    }
    S.analyser.getByteTimeDomainData(buf);
    let peak = 0;
    for (let i=0;i<buf.length;i++) peak = Math.max(peak, Math.abs(buf[i]-128)/128);
    const m = document.querySelector(`#t-${h.id} .meter`);
    if (m) { m.querySelector("i").style.width = Math.min(100, peak*160)+"%";
             m.classList.toggle("hot", peak > 0.92); }
    S.rafId = requestAnimationFrame(tick);
  };
  S.rafId = requestAnimationFrame(tick);
}

/* pagehide：放弃持有权 + 放资源 + 停掉在飞的采集，并重画一次。
   不重画的话页面会带着「按钮全禁用」的样子被冻进 BFCache，
   回来时若 pageshow 没如期触发（iOS 尤其不可靠），整页永久点不动。 */
window.addEventListener("pagehide", () => {
  S.holder = null; S.gen++; S.finish = null;
  clearInterval(S.tickId);
  if (S.cap) { const c = S.cap; S.cap = null; Promise.resolve(c.take()).catch(()=>{}); }
  releaseMic(true);
  render();
});
// 不看 e.persisted —— iOS 从后台回来时它未必为 true，漏一次复位就是整页卡死
window.addEventListener("pageshow", () => render());

/* ── 离开页面前拦一下 ──
   `takes` 只在内存里。志愿者录二十条、手滑刷新一次 → 全没了，而且事前
   毫无提示。这个 URL 已经写进征集文档发给外人了，代价不对称。

   **只在真的有「录了但没存」的东西时才拦。** 空手离开也弹的话，人很快
   就学会无视这个框，等真该拦的时候它已经不起作用了。

   ⚠️ 它挡不住的：浏览器崩溃、系统重启、以及**手机上标签页被内存压力
   丢弃**（iOS Safari 尤其激进）。要真正不丢得把音频落进 IndexedDB —— 
   那是另一件事，没做，别把这个警告当成「录音是安全的」。 */
const unsavedCount = () => takes.filter(tk => tk.blob && !tk.saved).length;
window.addEventListener("beforeunload", e => {
  if (!unsavedCount()) return;      // 反向：没有未保存的就不该拦
  e.preventDefault();
  e.returnValue = "";               // 老浏览器要这个才弹
  return "";
});

/* ── 录音 ── */
async function startTake(t) {
  if (S.holder) return;                 // 这道守卫必须在任何 await 之前同步占位
  if (!envCheck()) return;
  const token = ++tokenSeq;
  S.holder = { token, id:t.id, phase:"acquiring" };
  render();
  let started = false;
  try {
    const problem = await acquireMic(token);
    if (!owns(token)) return;
    if (problem) { if (!problem.superseded) { t.error = problem.msg; render(); } return; }
    t.error = null;

    const myGen = ++S.gen;
    let cap;
    const maxSeconds = Math.max(5, Math.min(600, +$("#maxsec").value || 240));
    try {
      cap = await startCapture(S.ctx, S.source, { maxSeconds });
    } catch (e) { t.error = T("capfail", { name:e.name, msg:e.message }); render(); return; }
    // 建采集节点要 await（AudioWorklet 得加载模块），期间可能已跨代：
    // 自己拆掉自己建的节点，绝不写进 S
    // take() 里 new Float32Array(total) 在长录音下可能抛；不接的话
    // 变成 unhandled rejection。同文件 pagehide 分支就是这么写的。
    if (!owns(token) || myGen !== S.gen) { Promise.resolve(cap.take()).catch(()=>{}); return; }
    S.cap = cap;

    const dst = +$("#rate").value || 0;
    S.finish = async () => {
      S.finish = null;                       // 连点两下停止只走一次
      clearInterval(S.tickId);
      const myCap = S.cap; S.cap = null;
      // **整段包在 try 里，take() 也算进来** —— 拼接 PCM 时 OOM 抛出的话，
      // 这个 async 函数会以未处理的 rejection 结束，而 holder 还停在 recording，
      // 麦克风和所有按钮永久卡死，只能刷新页面。
      try {
        const taken = myCap ? await myCap.take() : null;
        if (!owns(token) || myGen !== S.gen) return;
        S.holder.phase = "converting"; render();
        await new Promise(r => setTimeout(r, 0));   // 先让「转换中」画出来
        if (!taken || !taken.pcm.length) throw new Error(T("noaudio"));
        const target = dst || taken.sampleRate;
        // 估个应有时长，用来发现「只念了一半」。中文朗读约 4.5 字/秒、
        // 拉丁字母约 14 字符/秒 —— 分开算比用一个平均数诚实。
        // 这条只是**软**提示（analyseTake 里走 problems 不走 hard），
        // 估歪了他点「我听过了」就能放行。
        const txt = t.free ? "" : t.text;
        const cjk = (txt.match(/[\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af]/g) || []).length;
        const expectSeconds = txt ? cjk / 4.5 + (txt.length - cjk) / 14 : 0;
        const res = await toWav(taken.pcm, taken.sampleRate, target,
          { minSeconds: 1, expectSeconds, timeline: taken.timeline });
        if (taken.dropped) res.quality.problems.push(
          { zh:I18N.zh.dropped, en:I18N.en.dropped, th:I18N.th.dropped });
        // hash 算完再发布 —— 先写进 t 再 await 的话，等待期间发生 pagehide，
        // digest 回来后没人再拦，旧的收尾会把结果写到已经作废的那一代上
        const sha = await sha256hex16(res.blob);
        if (!owns(token) || myGen !== S.gen) return;
        // 换 blob 就把旧的 object URL 吊销。**URL 跟着 blob 走，不跟着重画走** ——
        // 原来每次 render 都新建一个，被移除的 <audio> 还在加载已吊销的那个，
        // 控制台一片 ERR_FILE_NOT_FOUND，而且 URL 一直在涨。
        if (t.url) URL.revokeObjectURL(t.url);
        Object.assign(t, { blob:res.blob, url:URL.createObjectURL(res.blob),
          quality:res.quality, seconds:res.seconds, sha,
          // **录音当时的文本快照。** 判「对不对得上」只能靠它 ——
          // 靠比较新旧两个列表的话，「先录一段自由录音、再贴脚本」这条路
          // （而且它是默认路径）会把无脚本的音频无警告地配上段落文本。
          recText: t.free ? null : t.text,
          saved:false, override:false, error:null, staleText:false,
          src:{ rate:taken.sampleRate, dst:target, backend:taken.backend,
                timeline:taken.timeline, track:S.trackSettings, ua:navigator.userAgent } });
      } catch (e) {
        if (!owns(token) || myGen !== S.gen) return;
        t.error = T("convfail", { name:e.name, msg:e.message });
      } finally {
        if (owns(token)) S.holder = null;
        releaseMic();
        render();
      }
    };

    started = true;
    const t0 = Date.now();
    S.holder.phase = "recording";
    render();
    // 计时器捕获自己的代次：读共享的 S.finish 的话，旧 interval 会去停新录音
    S.tickId = setInterval(() => {
      if (myGen !== S.gen) { clearInterval(S.tickId); return; }
      const secs = (Date.now()-t0)/1000;
      const el = document.querySelector(`#t-${t.id} .timer`);
      if (el) el.textContent = mmss(secs);
      if (secs >= maxSeconds && S.finish) S.finish();
    }, 200);
    levelLoop();
  } finally {
    // 没能进入录音状态就交还会话，否则按钮永久卡在禁用
    if (!started && owns(token)) { S.holder = null; releaseMic(); render(); }
  }
}

/* ── 存盘 ── */
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener"; a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);   // 0 ms 会赶在下载真正开始之前
}
const wavName = t => `${speakerId()}-${String(t.no).padStart(3,"0")}.wav`;

/* ── store-only ZIP（不压缩）──
   为一个打包引入整个压缩库不划算，而 WAV 本来也压不动多少，
   store 模式反而省 CPU。格式：本地头 + 数据 + 中央目录 + EOCD。 */
function crc32(u8) {
  let t = crc32.t;
  if (!t) { t = crc32.t = new Uint32Array(256);
    for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } }
  let crc = 0xFFFFFFFF;
  for (let i=0;i<u8.length;i++) crc = t[(crc ^ u8[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {          // files: [{name, bytes: Uint8Array}]
  // **先挡住 ZIP32 的边界，别静默产出坏包。**
  // 偏移和大小都是 u32、文件数是 u16 —— 超了就悄悄截断，
  // 打出来的 zip 能列目录、解压却是错的。240 秒 @48 kHz 每段约 23 MB，
  // 录一百多段就到 4 GB，声音克隆场景够得着。
  // 真要支持得上 ZIP64（多一套 64 位字段 + 额外的定位记录），
  // 那不是这个小工具该背的；这里改成当场拒绝并说清怎么办。
  let totalBytes = 0;
  for (const f of files) totalBytes += f.bytes.length + f.name.length * 3 + 76;
  if (files.length > 65535)
    throw new Error(T("ziptoomany", { n: files.length }));
  if (totalBytes > 0xFFFFFFFF - (1 << 20))
    throw new Error(T("ziptoobig", { gb: (totalBytes/1e9).toFixed(2) }));

  const enc = new TextEncoder(), chunks = [], central = [];
  let off = 0;
  const u16 = v => [v & 255, (v>>>8) & 255];
  const u32 = v => [v & 255, (v>>>8) & 255, (v>>>16) & 255, (v>>>24) & 255];
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.bytes), sz = f.bytes.length;
    // 0x0800 = 文件名按 UTF-8 解释，中文文件名才不会乱码
    const lh = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0)]);
    chunks.push(lh, nm, f.bytes);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800),
      ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(sz), ...u32(sz),
      ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
    off += lh.length + nm.length + sz;
  }
  const cstart = off;
  let csize = 0; for (const c of central) csize += c.length;
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(files.length), ...u16(files.length), ...u32(csize), ...u32(cstart), ...u16(0)]);
  return new Blob([...chunks, ...central, end], { type:"application/zip" });
}

function manifest() {
  const L = [];
  // **固定中英双语，不跟界面语言走** —— manifest 是给收集方看的，
  // 而收集方未必和录音的人用同一种语言；质量提示取英文，因为下游按
  // `!! flags:` 解析。
  L.push("# AgentEar recorder export / 录音工具导出");
  L.push(`# time ${new Date().toISOString()}`);
  L.push(`# speaker ${speakerLabel()}`);
  if (speakerLabel() !== speakerId()) L.push(`# filename prefix ${speakerId()} (filenames are ASCII-only)`);
  L.push(`# ui language ${LANG}`);
  L.push("#");
  L.push("# per take: text / WAV filename / SHA-256 (first 16) / capture settings / quality");
  L.push("# In `text:` lines, \\n is an escaped newline and \\\\ an escaped backslash (line-oriented file).");
  L.push("# ⚠️ The requested constraints (mono, AGC/NS off) are not proof the device obeyed;");
  L.push("#    the `track:` line is what getSettings() actually reported.");
  for (const t of takes) {
    if (!t.blob) continue;
    const s = t.src || {}, q = t.quality || {};
    L.push("");
    L.push(`## ${wavName(t)}`);
    // 段落内部允许有单换行（分段用的是空行），直接塞进按行解析的清单会撑破它。
    // 转义成 \n，并在文件头说明 —— 下游 `^text: ` 取一行就不会静默截断。
    L.push(`text: ${t.free ? "(free take, no reference text)" : t.text.replace(/\\/g,"\\\\").replace(/\n/g,"\\n")}`);
    L.push(`sha256_16: ${t.sha || "(unavailable)"}`);
    L.push(`audio: ${s.dst} Hz mono 16-bit · ${(t.seconds||0).toFixed(2)}s · captured at ${s.rate} Hz (${s.backend})`);
    if (s.track) L.push(`track: ch=${s.track.channelCount} rate=${s.track.sampleRate} ` +
      `aec=${s.track.echoCancellation} ns=${s.track.noiseSuppression} agc=${s.track.autoGainControl}`);
    if (s.timeline) L.push(`timeline: got ${s.timeline.gotFrames} / expected ${s.timeline.expectedFrames}` +
      (s.timeline.missingSeconds > 0.001 ? ` · MISSING ${s.timeline.missingSeconds.toFixed(3)}s` : ""));
    L.push(`quality: peak ${(q.peak||0).toFixed(3)} · SNR ${(q.snrDb||0).toFixed(1)} dB · voiced ${((q.voiced||0)*100).toFixed(0)}%`);
    if (q.hard && q.hard.length) L.push(`!! HARD FAIL: ${q.hard.map(x=>x.en).join("; ")}`);
    if (q.problems && q.problems.length)
      L.push(`!! flags: ${q.problems.map(x=>x.en).join("; ")}${t.override ? " [speaker confirmed after listening]" : ""}`);
    L.push(`ua: ${s.ua || ""}`);
  }
  return L.join("\n") + "\n";
}

/* 录音当时对着的文本，和这一段现在应该对着的文本，是不是同一个。
   四种情况都要判到：
     录时无脚本 → 现在有脚本   （默认路径！先录自由录音再贴脚本）
     录时有脚本 → 现在无脚本
     两边都有脚本但内容不同
     两边都没脚本            → 不算漂移 */
function isStale(t) {
  if (!t.blob) return false;
  const had = t.recText !== null && t.recText !== undefined;
  if (had !== !t.free) return true;
  return had && t.recText !== t.text;
}

/* ── 脚本 → 段落 ── */
function applyScript() {
  const paras = $("#script").value.split(/\n\s*\n/).map(normText).filter(Boolean);
  const keep = takes.filter(t => t.blob);          // 已有录音的不能因为改脚本就丢
  // 段落变少时多出来的录音会被永久丢弃。**未存过的必须先问一声** ——
  // 页脚那句「关掉页面就没了」防不住这个，因为人不觉得改脚本 = 删录音。
  const willDrop = keep.slice(Math.max(1, paras.length)).filter(t => !t.saved);
  if (willDrop.length && !confirm(T("confirmdrop",
      { n: willDrop.length, m: paras.length || 1 }))) return;
  takes.length = 0;
  // 下面按顺序贴回 keep，贴不下的那些永远不会再被引用 —— 现在就吊销，
  // 否则它们的 object URL 会一直挂到页面关闭
  if (paras.length) paras.forEach(p => takes.push({ id: ++seq, text:p, free:false }));
  else takes.push({ id: ++seq, text:"", free:true });
  // 按顺序贴回已录的；文本变了就标出来，让人知道这段对不上了
  keep.forEach((k, i) => {
    const t = takes[i];
    if (!t) { if (k.url) URL.revokeObjectURL(k.url); return; }
    Object.assign(t, { blob:k.blob, url:k.url, quality:k.quality, sha:k.sha,
      seconds:k.seconds, src:k.src, saved:k.saved, override:k.override,
      recText: k.recText });
    t.staleText = isStale(t); });
  lastParaCount = paras.length;
  $("#scripthint").textContent = paras.length ? T("nparas", { n: paras.length }) : T("freemode");
  save(); render();
}

/* ── 渲染 ── */
function render() {
  takes.forEach((t,i) => t.no = i+1);
  const box = $("#takes");
  box.innerHTML = "";
  const busy = !!S.holder;
  for (const t of takes) {
    const rec = S.holder && S.holder.id === t.id;
    const q = t.quality || {};
    const hard = (q.hard || []).map(qmsg);
    const soft = (q.problems || []).map(qmsg);
    const el = document.createElement("section");
    el.className = "take"; el.id = "t-" + t.id;
    el.dataset.state = rec ? S.holder.phase : (t.blob ? "done" : "idle");
    el.innerHTML = `
      <div class="take-head">
        <span class="no">${String(t.no).padStart(2,"0")}</span>
        <div class="txt${t.free?" free":""}">${t.free ? escapeHtml(T("freetake")) : escapeHtml(t.text)}</div>
      </div>
      <div class="ctl">
        <button class="btn rec">${escapeHtml(rec && S.holder.phase==="recording" ? T("stop") : (t.blob ? T("rerec") : T("rec")))}</button>
        <span class="timer">00:00</span>
        <span class="meter"><i></i></span>
        ${t.blob ? `<audio controls src="${t.url}"></audio><button class="btn dl">${escapeHtml(T("savetake"))}</button>` : ""}
      </div>
      ${t.staleText ? `<p class="bad">${escapeHtml(T("stale"))}</p>` : ""}
      ${t.error ? `<p class="bad">${escapeHtml(t.error)}</p>` : ""}
      ${hard.length ? `<p class="bad">✕ ${escapeHtml(hard.join("；") + T("hardsuffix"))}</p>` : ""}
      ${!hard.length && soft.length && !t.override
        ? `<p class="bad">⚠ ${escapeHtml(soft.join("；"))}<br><button class="btn ovr">${escapeHtml(T("override"))}</button></p>` : ""}
      ${t.blob ? `<p class="stat">${escapeHtml(T("statline", {
          secs:(t.seconds||0).toFixed(2), rate:t.src.dst, peak:(q.peak||0).toFixed(3),
          snr:(q.snrDb||0).toFixed(1), voiced:((q.voiced||0)*100).toFixed(0) })
          + (t.saved ? T("saved") : "") + (t.override ? T("overridden") : ""))}</p>` : ""}`;
    const rb = el.querySelector(".rec");
    rb.disabled = busy && !(rec && S.holder.phase === "recording");
    rb.onclick = () => {
      if (rec && S.holder.phase === "recording" && S.finish) { S.finish(); return; }
      startTake(t);
    };
    const dl = el.querySelector(".dl");
    if (dl) dl.onclick = () => { saveBlob(t.blob, wavName(t)); t.saved = true; render(); };
    const ov = el.querySelector(".ovr");
    if (ov) ov.onclick = () => { t.override = true; render(); };
    box.appendChild(el);
  }
  // 「可用」= 录了、时间线没洞、文本没漂、软问题要么没有要么他听过并放行了
  const usable = takes.filter(t => t.blob && !((t.quality||{}).hard||[]).length
    && !t.staleText && (!(((t.quality||{}).problems)||[]).length || t.override));
  $("#prog").textContent = T("prog", { ok: usable.length, all: takes.length });
  $("#prog").classList.toggle("ok", takes.length > 0 && usable.length === takes.length);
  $("#zip").disabled = busy || !takes.some(t => t.blob);
  // **会重建 takes 的控件在录音期间必须锁住。**
  // 不锁的话：录音中点「应用脚本」→ takes 全换成新 id → S.holder.id 匹配不上
  // 任何一段 → 每段的 rec 都是 false → 所有按钮 disabled，**页面上不再有
  // 「停止」** → 用户被锁到 maxSeconds 超时，而那段录音写进了一个已经不在
  // takes 里的孤儿对象，静默丢失。
  ["#apply","#addfree","#script","#rate","#maxsec"].forEach(sel => $(sel).disabled = busy);
}

/* ── 语言切换：只重画，不碰任何录音状态 ── */
function applyLang() {
  document.documentElement.lang = T("lang");
  document.title = "AgentEar " + T("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T(el.dataset.i18n); });
  $("#script").placeholder = T("scriptph");
  document.querySelectorAll(".langs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  rateHint(); memHint(); nameHint(); envCheck();
  $("#scripthint").textContent = lastParaCount ? T("nparas", { n: lastParaCount }) : T("freemode");
  if (!S.stream) { $("#devpill").textContent = T("micoff"); $("#devpill").classList.remove("ok"); }
  render();
}

/* ── 绑定 ── */
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => {
  LANG = b.dataset.lang; save(); applyLang();
});
$("#apply").onclick = applyScript;
$("#addfree").onclick = () => { takes.push({ id: ++seq, text:"", free:true }); render(); };
$("#rate").onchange = () => { rateHint(); save(); };
/* 文件名只用 ASCII，中文署名会被换成 anon 之类 —— 那是静默的，得说出来。
   原样的署名仍然写进 manifest，不丢信息。 */
const nameHint = () => {
  const raw = speakerLabel(), id = speakerId();
  $("#namehint").textContent = (raw === "anon" || raw === id) ? "" : T("namehint", { id, raw });
};
$("#speaker").oninput = () => { save(); nameHint(); render(); };   // 署名进文件名，改了要重画
/* 缓冲、拼接、重采样输出、WAV 各占一份内存。上限放太宽的话，
   手机会在「转换中」那一刻 OOM，整段录音丢失，而错误只会显示「转换失败」。 */
const memHint = () => {
  const secs = Math.max(5, Math.min(300, +$("#maxsec").value || 240));
  const mb = Math.round(secs * 48000 * 4 * 2 / 1e6);
  $("#memhint").textContent = T("memhint", { mb });
  $("#memhint").style.color = mb > 150 ? "var(--signal)" : "";
};
$("#maxsec").oninput = () => { save(); memHint(); };
$("#script").oninput = save;
$("#zip").onclick = async () => {
  const btn = $("#zip");
  btn.disabled = true; btn.textContent = T("zipping");
  try {
    const files = [];
    for (const t of takes) {
      if (!t.blob) continue;
      files.push({ name: wavName(t), bytes: new Uint8Array(await t.blob.arrayBuffer()) });
    }
    files.push({ name:"manifest.txt", bytes: new TextEncoder().encode(manifest()) });
    saveBlob(zipStore(files), `${speakerId()}-recordings.zip`);
    // **打包成功才算存过。** 抛异常时不能标 saved —— 那会让人以为存好了
    takes.forEach(t => { if (t.blob) t.saved = true; });
  } catch (e) {
    alert(T("zipfail", { msg: e.message }));
  } finally {
    btn.textContent = T("zipbtn");
    render();          // render 会按有没有 blob 重新决定按钮可用性
  }
};

load(); applyLang(); applyScript();
</script>
</body>
</html>
