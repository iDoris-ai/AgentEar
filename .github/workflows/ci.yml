# 每次 push / PR 跑测试。
#
# **为什么必须是 macOS runner**：这个项目大量用 macOS 专有的东西
# （CGEventTap 监听热键、CoreAudio 采集、`say`、TCC 权限），
# 在 Linux 上连编译都过不了。ubuntu 便宜十倍，但跑不了。
#
# **为什么不需要 vendor/**：ASR 二进制与模型不入库（见 CLAUDE.md），
# 但它们是**运行时**依赖。已实测：把 vendor/ 移走，203 个测试照样全绿。
# 需要它们的测试都标了 `#[ignore]`。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # merge queue（2026-11-11 启用）：入队的 PR 在临时合并提交上再跑一次 required check "test"，
  # 不用每次 main 前进都「同步 main → 重新批准」。
  merge_group:

# 同一个 PR 连推几次时，取消上一次还没跑完的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # macOS 自带 bash 3.2：`$VAR` 后紧跟全角字符会被当成变量名一部分，`set -u` 下直接崩。
      # 这个检查原来用 `grep -P`（macOS grep 不支持），一直是假绿（PR #106 才发现）；
      # 没人跑的检查等于没有检查，所以放进 CI。
      - name: shell 脚本检查（bash 3.2 全角字符坑）
        run: /bin/bash scripts/lint-shell.sh

      - name: 编译检查
        run: cargo build --locked

      # 新代码不许引入警告。既有的那几条（sidecar.rs 的函数指针转换）
      # 先不拦，否则这个 job 从第一天起就是红的，而一个长期红的 CI
      # 等于没有 CI。
      - name: clippy
        run: cargo clippy --all-targets

      - name: 测试
        run: cargo test --locked

      # Mac App Store 功能子集（docs/app-store.md 阶段 2）：验证它能编译、单测绿。
      # 只跑单测和脚本默认值测试：tests/builtin_model_locator 等集成测试验的是 speech_swift/Qwen3
      # 这类 MAS 子集里被压制的功能，在该 feature 下按设计会失败。
      # 默认构建的上面几步不受影响（feature 默认关）。
      - name: App Store 功能子集（cargo feature app-store）
        run: cargo test --locked --features app-store --bin agentear --test script_defaults
      # 沙箱探针（feature mas-probe，只给本机原型）至少要能编译，否则复测步骤用不了。
      - name: App Store 沙箱探针能编译（cargo feature mas-probe）
        run: cargo check --locked --features mas-probe --bin agentear

      # Python 边车（services/tts）的测试。**这一步原来是漏的**，代价实测到了：
      # v0.16.0 把方言 instruct 改成「只写方言名」时有一条测试当场变红，
      # 而 CI 只看 cargo，于是**红着发布了两版**，直到 v0.18.0 才发现
      # （那条测试当时还把旧行为钉着，翻绿反而是错的）。
      # 测试只用标准库 + 可选 numpy：没有 numpy 时响度那 3 条会 **skip**
      # ——skip 不等于通过，本机三个解释器都有 numpy，正常应报 42 passed。
      - name: TTS 边车测试
        run: python3 -m unittest discover -s services/tts -p 'test_*.py'
